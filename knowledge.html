<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>ThinkYet OS Knowledge — ThinkYet AI Company</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.js"></script>
    <style>
        :root {
            --bg-page: #f8fafc; --bg-sidebar: #ffffff; --bg-card: #ffffff; --border: #e2e8f0; --border-light: #f1f5f9;
            --text-main: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --primary: #2563eb; --primary-light: #eff6ff; --radius-card: 14px; --radius-sm: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-page); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 230px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 12px; flex-shrink: 0; }
        .brand-header { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px 8px; }
        .brand-icon { width: 32px; height: 32px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .brand-text h1 { font-size: 0.95rem; font-weight: 700; } .brand-text p { font-size: 0.72rem; color: var(--text-muted); }
        .nav-list { display: flex; flex-direction: column; gap: 2px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; }
        .nav-item:hover { background: var(--border-light); }
        .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .nav-icon { width: 18px; height: 18px; }
        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-header { height: 64px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
        .content-area { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 20px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand-header"><div class="brand-icon">T</div><div class="brand-text"><h1>ThinkYet</h1><p>AI Company</p></div></div>
        <div class="nav-list">
            <a href="index.html" class="nav-item"><i data-lucide="home" class="nav-icon"></i><span>Home</span></a>
            <a href="goals.html" class="nav-item"><i data-lucide="target" class="nav-icon"></i><span>Goals</span></a>
            <a href="agents.html" class="nav-item"><i data-lucide="users" class="nav-icon"></i><span>Agents</span></a>
            <a href="tasks.html" class="nav-item"><i data-lucide="check-square" class="nav-icon"></i><span>Tasks</span></a>
            <a href="decisions.html" class="nav-item"><i data-lucide="git-pull-request" class="nav-icon"></i><span>Decisions</span></a>
            <a href="knowledge.html" class="nav-item active"><i data-lucide="book-open" class="nav-icon"></i><span>Knowledge</span></a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="top-header"><h3 style="font-size: 1.1rem; font-weight: 700;">ThinkYet OS Knowledge Base</h3></header>
        <main class="content-area">
            <div>
                <h2>Canonical Machine Artifacts & Specs 📚</h2>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px;">Inspect active authority maps, visibility invariants, and risk registers loaded by OS Loader.</p>
            </div>
            <div class="card" id="knowledgeContainer">Loading OS Loader artifacts...</div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        fetch('/api/knowledge')
            .then(res => res.json())
            .then(data => {
                document.getElementById('knowledgeContainer').innerHTML = `
                    <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px;">Visibility Invariants (A3 Policy)</h3>
                    <pre style="background: #090a0f; color: #a6e3a1; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 0.85rem;">${JSON.stringify(data.visibility_policy, null, 2)}</pre>
                `;
            });
    </script>
</body>
</html>
