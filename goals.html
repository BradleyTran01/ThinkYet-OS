<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, initial-scale=1.0">
    <title>Goals Management — ThinkYet AI Company</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.js"></script>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --primary: #2563eb;
            --primary-light: #eff6ff;
            
            --success: #16a34a;
            --success-light: #f0fdf4;
            --warning: #d97706;
            --warning-light: #fffbeb;
            
            --radius-card: 14px;
            --radius-sm: 8px;
            --shadow-subtle: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR (230px) */
        .sidebar {
            width: 230px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            flex-shrink: 0;
        }

        .brand-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 20px 8px; }
        .brand-logo { display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 32px; height: 32px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; }
        .brand-text h1 { font-size: 0.95rem; font-weight: 700; color: var(--text-main); line-height: 1.2; }
        .brand-text p { font-size: 0.72rem; color: var(--text-muted); }

        .nav-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .nav-group-title { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 0 10px 4px 10px; }
        .nav-list { display: flex; flex-direction: column; gap: 2px; }
        
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
            font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; cursor: pointer;
        }
        .nav-item:hover { background: var(--border-light); color: var(--text-main); }
        .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .nav-icon { width: 18px; height: 18px; opacity: 0.8; }
        .nav-item.active .nav-icon { opacity: 1; color: var(--primary); }

        /* MAIN WRAPPER */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* TOP HEADER */
        .top-header {
            height: 64px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 28px; flex-shrink: 0;
        }

        .global-search { position: relative; width: 480px; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }
        .search-input { width: 100%; background: var(--bg-page); border: 1px solid var(--border); border-radius: 20px; padding: 8px 40px 8px 38px; font-size: 0.85rem; outline: none; }
        .search-shortcut { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.7rem; background: #ffffff; border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; color: var(--text-muted); }

        .header-actions { display: flex; align-items: center; gap: 16px; }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .avatar-img { width: 34px; height: 34px; border-radius: 50%; }

        /* CONTENT AREA */
        .content-area { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 24px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; }
        .greeting h2 { font-size: 1.4rem; font-weight: 700; }
        .greeting p { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }

        .btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
        .btn-primary { background: var(--primary); color: white; }

        /* GOALS GRID */
        .goals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .goal-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-card);
            padding: 24px; box-shadow: var(--shadow-subtle); display: flex; flex-direction: column; gap: 16px;
        }

        .goal-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .goal-title-group h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .goal-title-group p { font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }

        .badge-priority { font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--primary-light); color: var(--primary); }

        .progress-group { display: flex; flex-direction: column; gap: 6px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 4px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }

        /* MILESTONES LIST */
        .milestones-section { border-top: 1px solid var(--border-light); padding-top: 14px; }
        .milestones-title { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .milestone-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; padding: 6px 0; border-bottom: 1px solid var(--border-light); }
        .milestone-item:last-child { border-bottom: none; }
        
        .milestone-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-completed { background: var(--success); }
        .dot-in_progress { background: var(--primary); }
        .dot-pending { background: var(--text-muted); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand-header">
            <div class="brand-logo">
                <div class="brand-icon">T</div>
                <div class="brand-text">
                    <h1>ThinkYet</h1>
                    <p>AI Company</p>
                </div>
            </div>
        </div>

        <div class="nav-scroll">
            <div class="nav-group">
                <div class="nav-list">
                    <a href="index.html" class="nav-item">
                        <i data-lucide="home" class="nav-icon"></i>
                        <span>Home</span>
                    </a>
                    <a href="goals.html" class="nav-item active">
                        <i data-lucide="target" class="nav-icon"></i>
                        <span>Goals</span>
                    </a>
                    <a href="agents.html" class="nav-item">
                        <i data-lucide="users" class="nav-icon"></i>
                        <span>Agents</span>
                    </a>
                    <a href="tasks.html" class="nav-item">
                        <i data-lucide="check-square" class="nav-icon"></i>
                        <span>Tasks</span>
                    </a>
                    <a href="decisions.html" class="nav-item">
                        <i data-lucide="git-pull-request" class="nav-icon"></i>
                        <span>Decisions</span>
                    </a>
                    <a href="knowledge.html" class="nav-item">
                        <i data-lucide="book-open" class="nav-icon"></i>
                        <span>Knowledge</span>
                    </a>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <header class="top-header">
            <div class="global-search">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" class="search-input" placeholder="Search ThinkYet Goals...">
                <span class="search-shortcut">⌘K</span>
            </div>
            <div class="header-actions">
                <div class="user-profile">
                    <img src="logo.png" alt="Bradley Tran" class="avatar-img">
                </div>
            </div>
        </header>

        <main class="content-area">
            <div class="page-header">
                <div class="greeting">
                    <h2>Founder Goals Overview 🎯</h2>
                    <p>Track active AI company goals, milestone breakdowns, and agent ownership.</p>
                </div>
                <button class="btn btn-primary">
                    <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                    <span>Create Goal</span>
                </button>
            </div>

            <div class="goals-grid" id="goalsContainer">
                <!-- Dynamically populated via /api/goals -->
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        fetch('/api/goals')
            .then(res => res.json())
            .then(goals => {
                const container = document.getElementById('goalsContainer');
                container.innerHTML = goals.map(g => `
                    <div class="goal-card">
                        <div class="goal-card-header">
                            <div class="goal-title-group">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <h3>${g.title}</h3>
                                    <span class="badge-priority">${g.priority} PRIORITY</span>
                                </div>
                                <p>${g.description}</p>
                            </div>
                        </div>

                        <div class="progress-group">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${g.progress_percentage}%;"></div>
                            </div>
                            <div class="progress-text">
                                <span>Owner: <strong>${g.owner_agent}</strong></span>
                                <span style="font-weight: 700; color: var(--text-main);">${g.progress_percentage}% Completed</span>
                            </div>
                        </div>

                        <div class="milestones-section">
                            <div class="milestones-title">Milestones Breakdown</div>
                            ${g.milestones.map(m => `
                                <div class="milestone-item">
                                    <span>
                                        <span class="milestone-status-dot dot-${m.status.toLowerCase()}"></span>
                                        ${m.title}
                                    </span>
                                    <span style="font-weight: 600;">${m.progress_percentage}%</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            });
    </script>
</body>
</html>
